<aside class="form-card" id="enquiry">
  <span class="eyebrow">Free counselling</span>
  <h3 style="margin-bottom:6px">Talk to an expert</h3>
  <p class="small muted mb-16">Fill in the form and a counsellor will call you within one working day.</p>
  <form method="post" action="{% url 'core:quick_enquiry' %}">
    {% csrf_token %}
    <input type="hidden" name="lead_source" value="{{ lead_source|default:'destination_page' }}">
    {% include "includes/form.html" with form=form %}
    <button type="submit" class="btn btn--primary btn--block">Get free guidance</button>
  </form>
</aside>
