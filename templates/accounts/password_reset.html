{% extends "accounts/auth_base.html" %}
{% block auth_title %}Reset your password{% endblock %}
{% block auth_body %}
<p class="small muted mb-16">Enter your email and we will send you a reset link.</p>
<form method="post">{% csrf_token %}
  {% include "includes/form.html" with form=form %}
  <button class="btn btn--primary btn--block" type="submit">Send reset link</button>
</form>
{% endblock %}
