{% extends "dashboard/base_dashboard.html" %}
{% block page_title %}New application{% endblock %}
{% block dash_content %}
<div class="panel" style="max-width:900px">
  <div class="panel__head"><h2>Create an application</h2></div>
  <div class="panel__body">
    <form method="post">{% csrf_token %}
      <div class="form-grid">
        {% for field in form.visible_fields %}{% include "includes/field.html" with field=field %}{% endfor %}
      </div>
      <button class="btn btn--primary" type="submit">Create application</button>
      <a class="btn btn--ghost" href="{% url 'dashboard:application_list' %}">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
